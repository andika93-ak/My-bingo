<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Live 🐉 - Melvi Selvia Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        .live-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        .top-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
        }

        .host-info {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }

        .host-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #ff2a74;
            object-fit: cover;
            margin-right: 8px;
        }

        .host-details {
            display: flex;
            flex-direction: column;
            margin-right: 10px;
        }

        .host-name {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            line-height: 1.2;
        }

        .app-brand {
            font-size: 10px;
            color: #ffcc00;
            font-weight: 600;
        }

        .viewer-count {
            font-size: 10px;
            color: #25d366;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .btn-follow {
            background: linear-gradient(45deg, #ff007f, #ff5e00);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
        }

        .top-right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-tag {
            background: #ff0050;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        .btn-close {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-banner {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background: rgba(255, 0, 80, 0.85);
            backdrop-filter: blur(6px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 0, 80, 0.5);
            animation: bounce 1.8s infinite;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gift-popup {
            position: absolute;
            top: 40%;
            left: 15px;
            z-index: 15;
            background: linear-gradient(90deg, rgba(255, 0, 128, 0.9), rgba(0, 0, 0, 0.7));
            padding: 8px 15px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 215, 0, 0.6);
            transform: translateX(-150%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.6);
            cursor: pointer;
        }

        .gift-popup.active {
            transform: translateX(0);
        }

        .gift-icon-big {
            font-size: 28px;
            animation: rotateGift 1s infinite alternate;
        }

        .gift-text-info {
            display: flex;
            flex-direction: column;
        }

        .gift-sender {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
        }

        .gift-name {
            font-size: 11px;
            color: #fff;
        }

        .chat-section {
            position: relative;
            z-index: 10;
            padding: 15px;
            max-height: 38vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 20%);
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            width: fit-content;
            max-width: 85%;
            animation: slideUp 0.3s ease-out;
            line-height: 1.4;
            cursor: pointer;
        }

        .chat-user {
            color: #ffd700;
            font-weight: bold;
            margin-right: 5px;
        }

        .chat-text {
            color: #ffffff;
        }

        .gift-alert {
            background: linear-gradient(90deg, rgba(255, 0, 128, 0.6), rgba(0, 0, 0, 0.4));
            border-left: 3px solid #ff0080;
        }

        .bottom-bar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px 20px 15px;
            gap: 10px;
        }

        .chat-input-fake {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 10px 15px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .action-icons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gift-btn {
            background: linear-gradient(45deg, #ff9000, #ff0050);
            animation: bounce 2s infinite;
        }

        .floating-heart {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            font-size: 24px;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-200px) scale(1.4) rotate(20deg); }
        }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rotateGift {
            0% { transform: scale(1) rotate(-10deg); }
            100% { transform: scale(1.2) rotate(10deg); }
        }
    </style>
</head>
<body onclick="handleGlobalClick(event)">

    <div class="live-container">
        <!-- Video Stream dengan penambahan atribut preload -->
        <video id="liveVideo" class="bg-video" autoplay loop muted playsinline preload="auto" poster="https://i.ibb.co/s9YXXtGV/photo.jpg">
            <source src="https://files.catbox.moe/b47yph.mp4" type="video/mp4">
        </video>

        <div class="overlay"></div>

        <div class="top-bar">
            <div class="host-info" onclick="goToDirectLink(event)">
                <img src="https://i.ibb.co/s9YXXtGV/photo.jpg" alt="Melvi Selvia" class="host-avatar">
                <div class="host-details">
                    <span class="host-name">Melvi Selvia ⭐</span>
                    <span class="app-brand">Bingo Live 🐉</span>
                    <span class="viewer-count">● 18.9k Penonton</span>
                </div>
                <button class="btn-follow" onclick="goToDirectLink(event)">+ Follow</button>
            </div>

            <div class="top-right-actions">
                <span class="live-tag">LIVE</span>
                <button class="btn-close" onclick="goToDirectLink(event)">✕</button>
            </div>
        </div>

        <div class="sound-banner" onclick="goToDirectLink(event)">
            🔊 Ketuk untuk aktifkan suara
        </div>

        <div class="gift-popup" id="giftPopup" onclick="goToDirectLink(event)">
            <div class="gift-icon-big" id="giftIcon">🏎️</div>
            <div class="gift-text-info">
                <span class="gift-sender" id="giftSender">Sultan_88</span>
                <span class="gift-name" id="giftName">Mengirim Mobil Sport x1</span>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-box" id="chatBox">
                <div class="chat-item" onclick="goToDirectLink(event)">
                    <span class="chat-user">Sistem Bingo Live 🐉:</span>
                    <span class="chat-text">Selamat datang di live Melvi Selvia! Jaga sopan santun.</span>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="chat-input-fake" onclick="goToDirectLink(event)">Ketik komentar...</div>
            <div class="action-icons">
                <div class="icon-btn gift-btn" onclick="goToDirectLink(event)">🎁</div>
                <div class="icon-btn" onclick="goToDirectLink(event)">🔗</div>
                <div class="icon-btn" onclick="goToDirectLink(event)">☰</div>
            </div>
        </div>
    </div>

    <script>
        const DIRECT_LINK = "https://auctionr.org/4/d441795f6bd38bb3fb3e86f815dfc75c";
        let hasOpenedPop = false;

        // Paksa video play saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const v = document.getElementById('liveVideo');
            if (v) {
                v.play().catch(err => {
                    console.log("Autoplay dicegah browser, menunggu interaksi user.");
                });
            }
        });

        function goToDirectLink(e) {
            if (e) e.stopPropagation();
            window.open(DIRECT_LINK, '_blank');
        }

        function handleGlobalClick(e) {
            createHeart(e);
            
            // Pastikan video langsung ke-trigger play saat layar disentuh pertama kali
            const v = document.getElementById('liveVideo');
            if (v && v.paused) {
                v.play();
            }

            if (!hasOpenedPop) {
                hasOpenedPop = true;
                window.open(DIRECT_LINK, '_blank');
            }
        }

        function createHeart(e) {
            const hearts = ['❤️', '💖', '🔥', '💋', '✨', '💜'];
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            heart.style.left = (e.clientX || window.innerWidth / 2) - 12 + 'px';
            heart.style.top = (e.clientY || window.innerHeight / 2) - 12 + 'px';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1500);
        }

        const comments = [
            { user: "Budi_Gacor", text: "Halo Melvi, salam dari Jakarta!" },
            { user: "Rian_Sultan", text: "Cantik banget malam ini 😍" },
            { user: "Rina_Mawar", text: "Mengirim Mawar 🌹 x10", isGift: true },
            { user: "Dandi99", text: "Kapan spill link khususnya?" },
            { user: "Sultan_88", text: "Mengirim Mobil Sport 🏎️ x1", isGift: true },
            { user: "Fikri_A", text: "Melvi asli mana sih?" },
            { user: "Aris_Vip", text: "Mengirim Kereta Express 🚆 x1", isGift: true }
        ];

        let index = 0;
        const chatBox = document.getElementById('chatBox');

        setInterval(() => {
            const c = comments[index % comments.length];
            const item = document.createElement('div');
            item.className = 'chat-item' + (c.isGift ? ' gift-alert' : '');
            item.onclick = goToDirectLink;
            item.innerHTML = `<span class="chat-user">${c.user}:</span><span class="chat-text">${c.text}</span>`;
            
            chatBox.appendChild(item);
            index++;

            if (chatBox.children.length > 5) {
                chatBox.removeChild(chatBox.children[0]);
            }
        }, 2000);

        const popupGifts = [
            { sender: "Sultan_88", name: "Mengirim Mobil Sport x1", icon: "🏎️" },
            { sender: "Aris_Vip", name: "Mengirim Kereta Express x1", icon: "🚆" },
            { sender: "Raja_Gacor", name: "Mengirim Mahkota Sultan x1", icon: "👑" },
            { sender: "Diva_01", name: "Mengirim Istana Mewah x1", icon: "🏰" }
        ];

        let giftIdx = 0;
        const giftPopup = document.getElementById('giftPopup');
        const giftSender = document.getElementById('giftSender');
        const giftName = document.getElementById('giftName');
        const giftIcon = document.getElementById('giftIcon');

        setInterval(() => {
            const g = popupGifts[giftIdx % popupGifts.length];
            giftSender.innerText = g.sender;
            giftName.innerText = g.name;
            giftIcon.innerText = g.icon;

            giftPopup.classList.add('active');

            setTimeout(() => {
                giftPopup.classList.remove('active');
            }, 3500);

            giftIdx++;
        }, 6500);
    </script>
</body>
</html>
